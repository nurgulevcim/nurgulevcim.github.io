title: "Verinin Gerçekliği"
description: "Veri ile gerçekliğe uzanan bir yolculuk."

remote_theme: "mmistakes/minimal-mistakes@4.26.1"
minimal_mistakes_skin: "air"

# Gerekli pluginler
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-archives   # ⭐ KATEGORİLERİN ÇALIŞMASI İÇİN ZORUNLU

markdown: kramdown

author:
  name     : "Nurgül Evcim"
  bio      : "Ekonomi, veri analizi ve müşteri içgörüleri alanında çalışan bir veri odaklı araştırmacı."
  location : "Türkiye"

# BLOG AYARLARI
paginate: 5
paginate_path: "/blog/page:num/"

# Post koleksiyonu
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# KATEGORİ ARŞİVLERİNİN AKTİF OLMASI İÇİN
jekyll-archives:
  enabled:
    - categories
  layouts:
    category: archive
  permalinks:
    category: /categories/:name/

# Varsayılanlar
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single

  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      read_time: true
      comments: false
